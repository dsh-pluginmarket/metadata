name: Scan related DSH projects

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      github_token:
        description: 'Optional GitHub token (PAT or App token) to use instead of the default GitHub App token, e.g. when the App token is rate limited; leave empty for the default'
        required: false
        type: string

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # Create the issues with the GitHub App token instead of GITHUB_TOKEN:
      # events created via GITHUB_TOKEN do not trigger new workflow runs, so
      # issues opened here would never fire the validate-and-pr workflow.
      # owner/repositories are omitted so the token defaults to this repository.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.METADATA_APP_ID }}
          private-key: ${{ secrets.METADATA_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan GitHub projects and open issues
        env:
          # A manual run may supply its own token to bypass App-token rate
          # limits; empty input falls back to the default GitHub App token.
          GH_TOKEN: ${{ inputs.github_token || steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/scan-related-projects.mjs
