name: Validate metadata submission

# pnpm 11 requires node:sqlite; all jobs use Node 22+.
on:
  issues:
    types: [opened]
  pull_request:
    paths:
      - 'entries/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  validate-submission:
    # Issue forms do not reliably preserve labels unless the label already exists.
    # Use the title prefix as the primary trigger and keep the label as optional metadata.
    if: github.event_name == 'pull_request' || startsWith(github.event.issue.title, 'Add:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # pnpm 11 imports node:sqlite, so Node 22+ must be active before pnpm/action-setup.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - run: pnpm install --frozen-lockfile
      - name: Generate metadata from issue
        if: github.event_name == 'issues'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: node scripts/issue-to-entry.mjs
      - name: Validate metadata
        run: pnpm validate
      - name: Open pull request from issue
        if: github.event_name == 'issues'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "metadata: add entry from issue #${{ github.event.issue.number }}"
          branch: metadata/issue-${{ github.event.issue.number }}
          title: "metadata: add entry from issue #${{ github.event.issue.number }}"
          body: "Generated from #${{ github.event.issue.number }}. A maintainer must review and merge this pull request before publication."
          labels: metadata-submission
      - name: Comment on issue
        if: github.event_name == 'issues' && success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Metadata validated and a pull request was opened. It will become public only after maintainer review and merge.'
            })
