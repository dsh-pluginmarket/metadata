name: Validate metadata submission
on:
  issues:
    types: [opened]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  validate-and-pr:
    if: contains(github.event.issue.labels.*.name, 'metadata-submission')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Parse issue and create metadata
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          mkdir -p entries
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const body = process.env.ISSUE_BODY ?? '';
          const field = (label) => { const match = body.match(new RegExp(`### ${label}\\s*\\n\\s*([^\\n]+)`, 'i')); return match?.[1]?.trim() ?? ''; };
          const kind = field('Kind').toLowerCase();
          const name = field('Name');
          const githubRepo = field('GitHub repository');
          const npmPackage = field('npm package');
          const description = field('Description');
          const tags = field('Tags').split(',').map((x) => x.trim()).filter(Boolean);
          if (!['plugin', 'skill', 'preset'].includes(kind) || !name || !description || (!githubRepo && !npmPackage)) throw new Error('Missing or invalid required fields');
          const source = githubRepo ? 'github' : 'npm';
          const id = `${source}:${githubRepo || npmPackage}`;
          const entry = { id, kind, name, description, source, sources: [source], ...(githubRepo ? { githubRepo, repositoryUrl: `https://github.com/${githubRepo}` } : { npmPackage, repositoryUrl: `https://www.npmjs.com/package/${npmPackage}` }), tags, status: 'pending', official: false, submittedBy: process.env.ISSUE_USER, issueNumber: Number(process.env.ISSUE_NUMBER) };
          writeFileSync(`entries/${id.replace(/[^a-zA-Z0-9._-]/g, '_')}.json`, JSON.stringify(entry, null, 2) + '\\n');
          NODE
      - name: Validate metadata
        run: node scripts/validate.mjs
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "metadata: add entry from issue #${{ github.event.issue.number }}"
          branch: metadata/issue-${{ github.event.issue.number }}
          title: "metadata: add entry from issue #${{ github.event.issue.number }}"
          body: "Generated from #${{ github.event.issue.number }}. A maintainer must review and merge this pull request before publication."
          labels: metadata-submission
      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body: 'Metadata validated and a pull request was opened. It will become public only after maintainer review and merge.'})
